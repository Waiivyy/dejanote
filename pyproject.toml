[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dejanote"
dynamic = ["version"]
description = "Search your notes by meaning, entirely offline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Waiivyy" }]
keywords = ["semantic-search", "embeddings", "notes", "markdown", "offline", "privacy", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sentence-transformers>=6.0,<7",
    # The one-time download is kept free of telemetry, tokens and the native
    # transfer client through huggingface-hub settings. A new major version could
    # rename them, so only the tested major is allowed.
    "huggingface-hub>=1.31,<2",
    "truststore>=0.9",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dejanote = "dejanote.cli:app"

[project.urls]
Homepage = "https://github.com/Waiivyy/dejanote"
Issues = "https://github.com/Waiivyy/dejanote/issues"

[tool.hatch.version]
path = "src/dejanote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dejanote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the embedding model on disk (run `dejanote setup` once)",
]
